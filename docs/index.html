<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黃金參考價</title>
<meta name="theme-color" content="#B8860B">
<style>
  :root { --gold:#B8860B; --up:#D32F2F; --down:#2E7D32; --ink:#222; --sub:#666; --muted:#999; --bg:#faf8f3; --card:#fff; --line:#e8e4da; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 2px; color:var(--gold); }
  .sub { font-size:15px; color:var(--muted); margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:14px; }
  .label { font-size:18px; color:var(--sub); }
  .big { font-size:44px; font-weight:700; line-height:1.15; margin:2px 0; font-variant-numeric:tabular-nums; }
  .chg { font-size:20px; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .mini { font-size:15px; color:var(--muted); }
  .mini b { display:block; font-size:22px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; font-size:18px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); min-height:48px; }
  button.on { border-color:var(--gold); background:#fbf3df; color:#7a5a08; font-weight:700; }
  #ranges { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  #ranges button { padding:10px 2px; font-size:17px; white-space:nowrap; }
  .chart { position:relative; height:320px; }
  .tip { font-size:16px; color:var(--sub); text-align:center; margin:6px 0 0; }
  .note { font-size:14px; color:var(--muted); line-height:1.6; }
  .err { color:var(--up); font-size:18px; }
  .live { color:#2E7D32; }
  .live::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#2E7D32; margin-right:6px; vertical-align:1px; }
  .card h2 { font-size:20px; margin:0 0 10px; color:var(--ink); }
  .bar { position:relative; height:14px; border-radius:7px; background:linear-gradient(90deg,#d9ead3,#f3ead2,#f6d5d5); margin:22px 0 8px; }
  .dot { position:absolute; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--gold); border:3px solid #fff; box-shadow:0 0 0 1px var(--gold); }
  .ends { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); }
  .ends b { display:block; font-size:16px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .ends div:last-child { text-align:right; }
  .pos { font-size:18px; line-height:1.6; margin-top:10px; }
  .calc { display:flex; align-items:center; gap:10px; font-size:20px; flex-wrap:wrap; }
  .calc input { font:inherit; font-size:24px; width:110px; padding:8px 10px; border:1.5px solid var(--line); border-radius:12px; text-align:center; }
  .calc input:focus { outline:none; border-color:var(--gold); }
  .calc select { font:inherit; font-size:20px; padding:8px; border:1.5px solid var(--line); border-radius:12px; background:#fff; }
  .worth { font-size:36px; font-weight:700; margin:12px 0 2px; font-variant-numeric:tabular-nums; }
  .hint { font-size:15px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>黃金參考價</h1>
  <div class="sub" id="updated">讀取中…</div>

  <div class="card" id="pick">
    <div class="label" id="pickWhen">　</div>
    <div class="label">國際金價換算，<span class="unitTxt">每一錢</span></div>
    <div class="big" id="pickBuy">—</div>
    <div class="chg" id="pickChg">　</div>
    <div class="grid">
      <div class="mini" id="otherUnit">每一公克<b id="pickOther">—</b></div>
    </div>
  </div>

  <div class="row" id="ranges">
    <button data-r="today">今天</button>
    <button data-r="7">1 週</button>
    <button data-r="30" class="on">1 個月</button>
    <button data-r="90">3 個月</button>
    <button data-r="182">6 個月</button>
    <button data-r="365">1 年</button>
    <button data-r="730">2 年</button>
  </div>
  <div class="card">
    <div class="chart"><canvas id="c" role="img" aria-label="黃金參考價走勢圖"></canvas></div>
    <p class="tip">用手指點圖上任何一天，上面會顯示那天的價格</p>
  </div>

  <div class="row">
    <button id="uQ" class="on">看每一錢</button>
    <button id="uG">看每一公克</button>
  </div>

  <div class="card" id="calcCard">
    <h2>我的黃金現在價值多少？</h2>
    <div class="calc">
      <span>我有</span>
      <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 5">
      <select id="amtUnit"><option value="qian">錢</option><option value="liang">兩</option><option value="gram">公克</option></select>
    </div>
    <div class="worth" id="worth">—</div>
    <div class="hint" id="worthHint">輸入數量就會自動計算，下次打開會記得。</div>
  </div>

  <div class="card" id="posCard" hidden>
    <h2>現在算高還是低？（和近一年比）</h2>
    <div class="bar"><div class="dot" id="posDot"></div></div>
    <div class="ends">
      <div>近一年最低<b id="posLo">—</b><span id="posLoD"></span></div>
      <div>近一年最高<b id="posHi">—</b><span id="posHiD"></span></div>
    </div>
    <div class="pos" id="posTxt"></div>
  </div>

  <p class="note">價格來源：XAUS 國際黃金現貨價 × 美元匯率換算（中間價）。一錢 = 3.75 公克。早期的歷史資料是用目前匯率換算，和當時實際台幣價格會有一點差距。<br>
  拿金飾、金條去銀樓或銀行賣，收購價通常會再低一些，每家店也不同，實際金額以店家報價為準。</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  var Q = 3.75, WK = "日一二三四五六";
  var daily = [], today = { date: "", rows: [] };
  var range = "30", unit = "q", chart = null, pts = [];
  var userPicked = false, liveOk = false, fx = null, lastIntra = 0;
  var API = "https://xaus.com/api/v1", OZ = 31.1034768, REFRESH_MS = 60000;

  function v(g) { return unit === "q" ? Math.round(g * Q) : Math.round(g); }
  function fmt(n) { return n.toLocaleString("zh-TW") + " 元"; }
  function $(id) { return document.getElementById(id); }
  function fullDate(d) {
    var x = d.split("-");
    return x[0] + "/" + parseInt(x[1], 10) + "/" + parseInt(x[2], 10);
  }
  function dayLabel(d) {
    var dt = new Date(d + "T00:00:00+08:00");
    return dt.getFullYear() + "/" + (dt.getMonth() + 1) + "/" + dt.getDate() + "（" + WK[dt.getDay()] + "）";
  }

  function buildPoints() {
    if (range === "today") {
      var d = today.date;
      var rows = today.rows.length ? today.rows : [];
      var prevClose = null;
      for (var i = daily.length - 1; i >= 0; i--) if (daily[i][0] < d) { prevClose = daily[i]; break; }
      return rows.map(function (r, i) {
        return { label: r[0], when: dayLabel(d) + " " + r[0], buy: r[1],
                 prev: i > 0 ? rows[i - 1][1] : (prevClose ? prevClose[1] : null),
                 prevTxt: i > 0 ? "比 5 分鐘前" : "比前一天收盤" };
      });
    }
    var n = parseInt(range, 10);
    // 照真實日曆天數取資料（週末沒有交易，不能用筆數算）
    var last = new Date(daily[daily.length - 1][0] + "T00:00:00+08:00");
    var cut = new Date(last.getTime() - n * 86400000);
    var cutStr = cut.getFullYear() + "-" + String(cut.getMonth() + 1).padStart(2, "0") + "-" + String(cut.getDate()).padStart(2, "0");
    var off = 0;
    while (off < daily.length && daily[off][0] <= cutStr) off++;
    var sl = daily.slice(off);
    return sl.map(function (r, i) {
      var p = daily[off + i - 1];
      return { label: fullDate(r[0]), when: dayLabel(r[0]),
               buy: r[1], prev: p ? p[1] : null, prevTxt: "比前一天" };
    });
  }

  function show(i) {
    var p = pts[i]; if (!p) return;
    $("pickWhen").textContent = p.when;
    $("pickBuy").textContent = fmt(v(p.buy));
    $("pickOther").textContent = unit === "q" ? fmt(Math.round(p.buy)) : fmt(Math.round(p.buy * Q));
    $("otherUnit").firstChild.textContent = unit === "q" ? "每一公克" : "每一錢";
    var c = $("pickChg");
    if (p.prev) {
      var diff = v(p.buy) - v(p.prev), pct = (diff / v(p.prev) * 100).toFixed(1);
      if (diff > 0) { c.textContent = "▲ " + p.prevTxt + "漲 " + diff.toLocaleString("zh-TW") + " 元（+" + pct + "%）"; c.style.color = "var(--up)"; }
      else if (diff < 0) { c.textContent = "▼ " + p.prevTxt + "跌 " + (-diff).toLocaleString("zh-TW") + " 元（" + pct + "%）"; c.style.color = "var(--down)"; }
      else { c.textContent = p.prevTxt + "一樣"; c.style.color = "var(--sub)"; }
    } else { c.textContent = "　"; }
    if (chart) {
      chart.data.datasets[0].pointRadius = pts.map(function (_, k) { return k === i ? 8 : 0; });
      chart.update("none");
    }
  }

  function draw() {
    pts = buildPoints();
    document.querySelectorAll(".unitTxt").forEach(function (e) { e.textContent = unit === "q" ? "每一錢" : "每一公克"; });
    if (!pts.length) {
      if (chart) { chart.destroy(); chart = null; }
      $("pickWhen").textContent = "今天還沒有資料";
      return;
    }
    var data = pts.map(function (p) { return v(p.buy); });
    var cfg = {
      type: "line",
      data: { labels: pts.map(function (p) { return p.label; }),
              datasets: [{ data: data, borderColor: "#B8860B", backgroundColor: "rgba(184,134,11,0.12)",
                           fill: true, borderWidth: 3, tension: 0.25, pointRadius: 0,
                           pointHoverRadius: 8, pointBackgroundColor: "#B8860B",
                           pointBorderColor: "#fff", pointBorderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        onClick: function (e, a) { if (a.length) { userPicked = true; show(a[0].index); } },
        onHover: function (e, a) { if (a.length) { userPicked = true; show(a[0].index); } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#888", font: { size: 13 }, maxTicksLimit: range === "today" ? 6 : 3, maxRotation: 0 } },
          y: { grid: { color: "#eee" }, ticks: { color: "#888", font: { size: 14 },
               callback: function (x) { return x.toLocaleString("zh-TW"); } } }
        }
      }
    };
    if (chart) chart.destroy();
    chart = new Chart($("c"), cfg);
    show(pts.length - 1);
  }

  function bind() {
    document.querySelectorAll("#ranges button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("#ranges button").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on"); range = b.getAttribute("data-r"); userPicked = false; draw();
      });
    });
    $("uQ").addEventListener("click", function () { unit = "q"; $("uQ").classList.add("on"); $("uG").classList.remove("on"); userPicked = false; draw(); });
    $("uG").addEventListener("click", function () { unit = "g"; $("uG").classList.add("on"); $("uQ").classList.remove("on"); userPicked = false; draw(); });
  }

  function latest() { return daily.length ? daily[daily.length - 1] : null; }

  function renderPosition() {
    var L = latest(); if (!L) return;
    var last = new Date(L[0] + "T00:00:00+08:00");
    var cut = new Date(last.getTime() - 365 * 86400000);
    var cutStr = cut.getFullYear() + "-" + String(cut.getMonth() + 1).padStart(2, "0") + "-" + String(cut.getDate()).padStart(2, "0");
    var yr = daily.filter(function (r) { return r[0] > cutStr; });
    if (yr.length < 20) return;
    var lo = yr[0], hi = yr[0];
    yr.forEach(function (r) { if (r[1] < lo[1]) lo = r; if (r[1] > hi[1]) hi = r; });
    var now = Math.round(L[1] * Q), loQ = Math.round(lo[1] * Q), hiQ = Math.round(hi[1] * Q);
    var pct = hiQ > loQ ? (now - loQ) / (hiQ - loQ) : 0.5;
    $("posDot").style.left = Math.max(0, Math.min(100, pct * 100)) + "%";
    $("posLo").textContent = fmt(loQ); $("posLoD").textContent = fullDate(lo[0]);
    $("posHi").textContent = fmt(hiQ); $("posHiD").textContent = fullDate(hi[0]);
    var belowHi = ((hiQ - now) / hiQ * 100).toFixed(1), aboveLo = ((now - loQ) / loQ * 100).toFixed(1);
    var where = pct >= 0.8 ? "接近近一年的高點" : pct <= 0.2 ? "接近近一年的低點" : "在近一年的中間位置";
    $("posTxt").textContent = "現在每錢 " + fmt(now) + "，" + where + "：比最高點低 " + belowHi + "%，比最低點高 " + aboveLo + "%。";
    $("posCard").hidden = false;
  }

  function renderWorth() {
    var L = latest(), el = $("worth"), hint = $("worthHint");
    var raw = $("amt").value.trim(), u = $("amtUnit").value;
    try { localStorage.setItem("goldAmt", raw); localStorage.setItem("goldUnit", u); } catch (e) {}
    if (!L) return;
    if (raw === "") { el.textContent = "—"; hint.textContent = "輸入數量就會自動計算，下次打開會記得。"; hint.style.color = ""; return; }
    var n = parseFloat(raw);
    if (!(n > 0)) { el.textContent = "—"; hint.textContent = "請輸入大於 0 的數字"; hint.style.color = "var(--up)"; return; }
    var grams = u === "qian" ? n * Q : u === "liang" ? n * Q * 10 : n;
    el.textContent = "約 " + fmt(Math.round(grams * L[1]));
    hint.style.color = "";
    hint.textContent = "用 " + fullDate(L[0]) + " 最新價格（每錢 " + fmt(Math.round(L[1] * Q)) + "）計算。這是國際金價換算，拿去賣的收購價通常會再低一些，金飾還會依成色扣折。";
  }

  // ---------- 即時金價（每 60 秒更新，網頁在背景時暫停） ----------
  function taipeiTime(d) {   // 用資料來源伺服器的時間，不依賴手機時鐘準不準
    var s = (d || new Date()).toLocaleString("sv-SE", { timeZone: "Asia/Taipei", hour12: false });
    return { date: s.slice(0, 10), hm: s.slice(11, 16) };
  }
  function getJSON(u) {
    return fetch(u, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function liveSpot() {
    return getJSON(API + "/spot?currency=TWD&unit=gram&compact=1").then(function (j) {
      var usd = +j.spot_usd_oz, f = +j.fx_rate, g = usd * f / OZ, x = j.xau || {};
      if (x.currency === "TWD" && (x.unit === "gram" || x.unit === "g") && Math.abs(x.price - g) / g < 0.01) g = +x.price;
      if (!(g > 0)) throw new Error("bad price");
      fx = f;
      var at = new Date(j.updated_at || (j.data_state || {}).as_of || Date.now());
      if (isNaN(at)) at = new Date();
      return { g: Math.round(g * 100) / 100, status: (j.data_state || {}).status || "", at: at };
    });
  }
  function liveIntraday(date) {
    return getJSON(API + "/intraday?symbol=xau&hours=24").then(function (j) {
      var rows = [];
      (j.points || []).forEach(function (p) {
        var s = new Date(p.t * 1000).toLocaleString("sv-SE", { timeZone: "Asia/Taipei", hour12: false });
        if (s.slice(0, 10) === date) rows.push([s.slice(11, 16), Math.round(p.p * fx / OZ * 100) / 100]);
      });
      return rows;
    });
  }
  function refresh() {
    if (!daily.length) return;
    liveSpot().then(function (sp) {
      var t = taipeiTime(sp.at), wd = new Date(t.date + "T00:00:00+08:00").getDay();
      if (wd >= 1 && wd <= 5) {   // 平日才更新今天這一筆，週末不新增假的資料點
        var last = daily[daily.length - 1];
        if (last[0] === t.date) daily[daily.length - 1] = [t.date, sp.g];
        else if (last[0] < t.date) daily.push([t.date, sp.g]);
      }
      var job = Promise.resolve();
      if (Date.now() - lastIntra > 290000) {   // 盤中走勢每 5 分鐘才重抓一次
        job = liveIntraday(t.date).then(function (rows) { lastIntra = Date.now(); today = { date: t.date, rows: rows }; })
                                  .catch(function () {});
      }
      return job.then(function () {
        if (today.date !== t.date) today = { date: t.date, rows: [] };
        var rows = today.rows, lr = rows[rows.length - 1];
        if (!lr || lr[0] < t.hm) rows.push([t.hm, sp.g]);
        else if (lr[0] === t.hm) rows[rows.length - 1] = [t.hm, sp.g];
        var note = sp.status && sp.status !== "fresh" ? "（資料暫時沒有更新，顯示最後價格）" : "（每分鐘自動更新）";
        var el = $("updated");
        el.className = "sub live";
        el.textContent = "即時金價：每錢 " + fmt(Math.round(sp.g * Q)) + "，" + t.hm + " 更新" + note;
        liveOk = true;
        if (!userPicked) draw();
        renderPosition(); renderWorth();
      });
    }).catch(function () {
      if (!liveOk) $("updated").textContent += "（目前抓不到即時金價，顯示的是最近一次排程的資料）";
    });
  }
  setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });

  bind();
  try {
    var sa = localStorage.getItem("goldAmt"), su = localStorage.getItem("goldUnit");
    if (sa) $("amt").value = sa;
    if (su) $("amtUnit").value = su;
  } catch (e) {}
  $("amt").addEventListener("input", renderWorth);
  $("amtUnit").addEventListener("change", renderWorth);
  var bust = "?t=" + Date.now();
  Promise.all([
    fetch("data/daily.json" + bust).then(function (r) { return r.json(); }),
    fetch("data/today.json" + bust).then(function (r) { return r.json(); }).catch(function () { return { date: "", rows: [] }; })
  ]).then(function (res) {
    daily = res[0].rows || []; today = res[1];
    $("updated").textContent = "資料更新：" + (res[0].updated || "") + "（台灣時間）";
    draw(); renderPosition(); renderWorth();
    refresh();
  }).catch(function () {
    $("updated").innerHTML = '<span class="err">資料讀取失敗，請稍後再打開一次</span>';
  });
})();
</script>
</body>
</html>
